name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup XcodeGen
        run: brew install xcodegen

      - name: Generate and Archive
        run: |
          xcodegen generate
          xcodebuild archive -project MyApp.xcodeproj -scheme MyApp -configuration Release -archivePath build/MyApp.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/MyApp.xcarchive/Products/Applications/MyApp.app Payload/
          zip -r MyApp.ipa Payload
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: MyApp.ipa
